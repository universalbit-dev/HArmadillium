global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    user haproxy
    group haproxy
    maxconn 5000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

frontend fe_http
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/host.pem
    http-request set-header X-Forwarded-Proto https
    default_backend be_nginx_https

backend be_nginx_https
    balance roundrobin
    option httpchk GET /
    http-check expect status 200

    # Single-node bootstrap target:
    server node1 127.0.0.1:443 ssl verify none check

    # HA multi-node example (uncomment and adapt):
    # server node1 192.168.1.101:443 ssl verify none check
    # server node2 192.168.1.102:443 ssl verify none check
    # server node3 192.168.1.103:443 ssl verify none check